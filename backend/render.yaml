services:
  - type: web
    name: ai-voice-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: "AI Voice Calling Platform"
      - key: DEBUG
        value: "False"
      - key: TELEPHONY_PROVIDER
        value: "exotel"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: NVIDIA_MODEL
        value: "moonshotai/kimi-k3"
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_API_BASE_URL
        value: "https://newsapi.org/v2"
      - key: NEWS_COUNTRY
        value: "in"
      - key: VOICE_AGENT_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
